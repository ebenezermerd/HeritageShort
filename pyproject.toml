[project]
name = "heritage-short"
version = "0.1.0"
description = "Storyboard-driven pipeline for the Forty Springs short film"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "requests>=2.32",
    "Pillow>=10.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
